[project]
name = "claude-code-switcher"
version = "0.1.0"
description = "Local Anthropic-compatible model router for Claude Code"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.104.0",
    "httpx>=0.25.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.24.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.13.0",
    "ty>=0.0.1a21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [
    "check_*.py",
    "debug_*.py",
    "scripts/diagnostics/**",
    "simple_*.py",
    "test_*.py",
    "verify_*.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ty.src]
exclude = [
    "check_*.py",
    "debug_*.py",
    "simple_*.py",
    "test_*.py",
    "tests/**",
    "verify_*.py",
]
